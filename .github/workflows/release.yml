name: Build e Release MansuLoader

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários
        run: |
          python -m unittest discover -s tests -v

      - name: Instalar FFmpeg para embutir no executável
        run: |
          curl -L -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath C:\ffmpeg_extract -Force
          $ffmpegExe = Get-ChildItem -Path C:\ffmpeg_extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Path C:\ffmpeg\bin -Force | Out-Null
          Copy-Item $ffmpegExe.FullName -Destination C:\ffmpeg\bin\ffmpeg.exe -Force

      - name: Gerar MansuLoader.exe
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name MansuLoader `
            --icon "assets\mansuloader.ico" `
            --splash "assets\splash.png" `
            --add-data "assets;assets" `
            --add-binary "C:\ffmpeg\bin\ffmpeg.exe;." `
            --collect-all customtkinter `
            --collect-all yt_dlp `
            main.py

      - name: Ler versão do version.json
        id: meta
        shell: pwsh
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          echo "version=$($json.version)" >> $env:GITHUB_OUTPUT

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: MansuLoader v${{ steps.meta.outputs.version }}
          make_latest: true
          files: dist/MansuLoader.exe
